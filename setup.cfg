[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    *.egg-info
ignore =
    E501,   # line too long (covered by max-line-length)
    W503    # line break before binary operator
per-file-ignores =
    # allow broad except clauses in memory-layer code
    hill_climb_racing_trainer_V2.py: E722

[mypy]
python_version = 3.10
strict = False
ignore_missing_imports = True
